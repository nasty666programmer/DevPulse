server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend routes — mirrors the Vite dev-proxy (see vite.config.ts) so the
    # frontend can keep using relative fetch('/feed/...') / fetch('/rss/...')
    # unchanged. In Kubernetes the Ingress intercepts these paths before they
    # ever reach this container, so this block only matters for docker-compose.
    location /feed/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    location /rss/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # SPA fallback for client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
