server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend routes — mirrors the Vite dev-proxy (see vite.config.ts) so the
    # frontend can keep using relative fetch('/feed/...') / fetch('/rss/...')
    # unchanged. In Kubernetes the Ingress intercepts these paths before they
    # reach this container in normal operation, but nginx still resolves this
    # hostname at startup regardless of whether traffic ever hits it — it MUST
    # match a real, resolvable hostname in every environment this image runs
    # in. "backend-service" is the k8s Service name (backend-service.yaml);
    # docker-compose.yml's backend service is named to match.
    location /feed/ {
        proxy_pass http://backend-service:3000;
        proxy_set_header Host $host;
    }

    location /rss/ {
        proxy_pass http://backend-service:3000;
        proxy_set_header Host $host;
    }

    location /digest/ {
        proxy_pass http://backend-service:3000;
        proxy_set_header Host $host;
    }

    # Carries the session cookie — must forward Cookie/Set-Cookie as-is,
    # which proxy_pass does by default (only proxy_set_header Host is added,
    # same as the sibling locations above).
    location /auth/ {
        proxy_pass http://backend-service:3000;
        proxy_set_header Host $host;
    }

    location /telegram/ {
        proxy_pass http://backend-service:3000;
        proxy_set_header Host $host;
    }

    # No trailing slash on the prefix here — unlike the others above,
    # POST/GET/DELETE all hit the bare path (/feed-sources, not
    # /feed-sources/...), and a "/feed-sources/" location wouldn't match
    # requests without a trailing slash.
    location /feed-sources {
        proxy_pass http://backend-service:3000;
        proxy_set_header Host $host;
    }

    location /users/ {
        proxy_pass http://backend-service:3000;
        proxy_set_header Host $host;
    }

    # SPA fallback for client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
