<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>DevPulse</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Apply saved/preferred theme before first paint to avoid a flash of the wrong theme.
      // Dark is the default theme (see DESIGN_SPEC.md §0/§1.1); light is an equal alternative.
      (function () {
        try {
          var stored = localStorage.getItem('devpulse-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
