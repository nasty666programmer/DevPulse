apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devpulse-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # k3s ships Traefik as its built-in ingress controller — use it as-is instead
  # of installing ingress-nginx separately. Do NOT pass --disable traefik when
  # installing k3s on the server, or nothing will route traffic at all (only
  # --disable servicelb --disable metrics-server are safe to trim for RAM).
  ingressClassName: traefik
  rules:
    - host: pulsedev.duckdns.org
      http:
        paths:
          - path: /feed
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3000
          - path: /rss
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
  tls:
    - hosts: ["pulsedev.duckdns.org"]
      secretName: devpulse-tls
