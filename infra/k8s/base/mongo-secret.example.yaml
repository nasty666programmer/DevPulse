# Template only — do NOT commit the real secret. Create it directly in the
# cluster instead, e.g.:
#   kubectl create secret generic mongo-secret \
#     --from-literal=MONGO_INITDB_ROOT_USERNAME=digestAdmin \
#     --from-literal=MONGO_INITDB_ROOT_PASSWORD='<a-real-password>'
#
# Whatever you set here must match the credentials embedded in backend-secret's
# MONGO_URI (secret.example.yaml) — they're two views of the same login.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: digestAdmin
  MONGO_INITDB_ROOT_PASSWORD: <password>
