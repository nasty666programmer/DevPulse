# Template only — do NOT commit the real secret. Create it directly in the
# cluster instead, e.g.:
#   kubectl create secret generic backend-secret \
#     --from-literal=MONGO_URI='mongodb://user:pass@host:27017/db?authSource=admin'
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  # Must use the same <user>/<password> as mongo-secret.example.yaml's
  # MONGO_INITDB_ROOT_USERNAME/PASSWORD — mongo-service is the in-cluster
  # StatefulSet (mongo-statefulset.yaml), not an external host.
  MONGO_URI: 'mongodb://<user>:<password>@mongo-service:27017/digital_ai_project?authSource=admin'
