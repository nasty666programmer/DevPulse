apiVersion: batch/v1
kind: CronJob
metadata:
  name: rss-collect
spec:
  schedule: "0 * * * *" # matches config's DEFAULT_RSS_CRON_SCHEDULE (§ backend/src/modules/config)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600 # 10 min ceiling so a hung run doesn't block the next tick
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: rss-collect
              image: ghcr.io/nasty666programmer/devpulse-backend:latest # same image as backend-deployment
              imagePullPolicy: IfNotPresent
              command: ["node", "dist/bin/collect.js"]
              envFrom:
                - configMapRef:
                    name: backend-config
                - secretRef:
                    name: backend-secret
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
