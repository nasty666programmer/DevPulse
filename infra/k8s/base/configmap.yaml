apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  PORT: "3000"
  NODE_ENV: "production"
  # Scheduling moves to CronJob.spec.schedule (rss-collect-cronjob.yaml) instead —
  # every backend replica running its own node-cron would collect N times in parallel.
  ENABLE_IN_PROCESS_SCHEDULER: "false"
  # Swagger UI (/docs) is for local testing only — same image runs here and in
  # docker-compose, and NODE_ENV can't tell them apart (Dockerfile hardcodes it
  # to "production" for both), so this is a dedicated toggle.
  ENABLE_SWAGGER: "false"
  RSS_FEEDS: '["https://news.ycombinator.com/rss","https://www.reddit.com/r/programming/.rss","https://nodeweekly.com/rss"]'
  RSS_FETCH_CONCURRENCY: "3"
  DEFAULT_ITEMS_LIMIT: "20"
  FEEDS_PAGE_SIZE: "5"
