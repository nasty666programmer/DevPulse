apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Applied on the real Hetzner server: kubectl apply -k infra/k8s/overlays/prod
# base already ships replicas: 2 for both Deployments, so nothing to patch there.
resources:
  - ../../base

# Once a real domain is bought and cert-manager is set up on the server, patch
# the Ingress host here (and uncomment the cert-manager annotation + tls block
# in base/ingress.yaml) instead of hardcoding it into base.
# patches:
#   - target:
#       kind: Ingress
#       name: devpulse-ingress
#     patch: |-
#       - op: replace
#         path: /spec/rules/0/host
#         value: <real-domain>
