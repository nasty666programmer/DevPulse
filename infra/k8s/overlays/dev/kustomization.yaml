apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# For local testing in kind/minikube before applying to the real cluster
# (docs/kubernetes-migration.md §9): kubectl apply -k infra/k8s/overlays/dev
resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 25m, memory: 64Mi }
          limits: { cpu: 250m, memory: 256Mi }
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Ingress
      name: devpulse-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: devpulse.local
