name: Summarizer CI

on:
  push:
    branches: [main]
    paths:
      - 'summarizer-service/**'
      - '.github/workflows/summarizer-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'summarizer-service/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: summarizer-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: summarizer-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Real-model smoke test (loads facebook/bart-large-cnn, ~1.63GB) —
      # slow, not a stub. See docs/superpowers/specs/2026-08-25-hf-summarization-design.md
      # and tests/test_main.py's own comment for why this isn't mocked.
      - run: python -m pytest tests/ -v
