name: Build, Push and Deploy

on:
  workflow_dispatch: # manual only — run from the Actions tab: "Build, Push and Deploy" → "Run workflow"

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/devpulse-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/devpulse-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:sha-${{ steps.vars.outputs.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          # Vite inlines this at build time — must be passed here, not just set
          # as a runtime k8s env var, or the built bundle ships with sign-in
          # broken (empty client id). Repo variable, not a secret: this id is
          # public by design, it ends up embedded in the shipped JS either way.
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:sha-${{ steps.vars.outputs.sha }}

  # Deploy manifests + the SSH deploy mechanism now live in the private
  # nasty666programmer/pulsedev-infra repo (kept out of this public repo on
  # purpose — see docs/kubernetes-migration.md). This just hands off the built
  # commit's SHA; that repo's own Deploy workflow does the actual kubectl work.
  trigger-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy to pulsedev-infra
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: nasty666programmer/pulsedev-infra
          event-type: deploy
          client-payload: '{"sha": "${{ needs.build-and-push.outputs.sha }}"}'
